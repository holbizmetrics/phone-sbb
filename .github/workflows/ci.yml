name: CI — build test

# Tier-1 "don't ship a white-screen" gate. Runs on every push and PR.
# It does NOT change how Pages deploys (that's the separate Tier-2 step) —
# it reports pass/fail so a broken change shows red.

on:
  push:
    branches-ignore: [master]   # master pushes are handled by deploy.yml (test + deploy-on-green)
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax-check the inline script (catches white-screen typos)
        run: node tests/syntax-check.mjs

      # Deliberately a GLOB, not a hand-written list. The list version silently
      # orphaned four suites (chip-storm, journey-race, touch, wander); T8 broke
      # two of them and CI stayed green because it never ran them. Adding a test
      # file must be enough to make it run. smoke.mjs is excluded here only
      # because it needs the browser installed in the step below.
      - name: Offline unit tests (no browser -- these also run on the phone)
        run: |
          fail=0
          for t in tests/*.mjs; do
            [ "$t" = "tests/smoke.mjs" ] && continue
            echo "::group::$t"
            node "$t" || fail=1
            echo "::endgroup::"
          done
          exit $fail

      - name: Install Playwright (Chromium)
        run: |
          npm init -y >/dev/null
          npm install --no-save playwright@^1.47.0
          npx playwright install --with-deps chromium

      - name: Smoke test (headless render + no console errors)
        run: node tests/smoke.mjs
