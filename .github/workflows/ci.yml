name: CI — build test

# Tier-1 "don't ship a white-screen" gate. Runs on every push and PR.
# It does NOT change how Pages deploys (that's the separate Tier-2 step) —
# it reports pass/fail so a broken change shows red.

on:
  push:
    branches-ignore: [master]   # master pushes are handled by deploy.yml (test + deploy-on-green)
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax-check the inline script (catches white-screen typos)
        run: node tests/syntax-check.mjs

      - name: Offline unit tests (no browser -- these also run on the phone)
        run: |
          node tests/boot-wiring.mjs
          node tests/keyboard.mjs
          node tests/mode-filter.mjs
          node tests/route-history.mjs
          node tests/golden-hour.mjs
          node tests/enroute.mjs
          node tests/summit.mjs
          node tests/storage-full.mjs
          node tests/board-refresh.mjs
          node tests/outage-not-verdict.mjs
          node tests/verbund.mjs
          node tests/vehicle.mjs
          node tests/last-home.mjs
          node tests/train-class.mjs

      - name: Install Playwright (Chromium)
        run: |
          npm init -y >/dev/null
          npm install --no-save playwright@^1.47.0
          npx playwright install --with-deps chromium

      - name: Smoke test (headless render + no console errors)
        run: node tests/smoke.mjs
