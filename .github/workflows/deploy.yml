name: Deploy to Pages (gated)

# Tier-2 atomic deploy: master goes live ONLY when the build test passes.
# A failed test = the deploy is skipped and Pages keeps serving the last good
# version (the site never goes down on a bad push). Requires the repo's Pages
# "Source" to be set to "GitHub Actions" (Settings -> Pages -> Build and
# deployment -> Source). While Source is still "Deploy from a branch", this
# workflow's deploy step is a no-op-that-fails harmlessly; the cutover is the
# Source switch, and it is reversible (switch back to a branch anytime).

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax-check the inline script
        run: node tests/syntax-check.mjs
      - name: Offline unit tests (no browser -- these also run on the phone)
        run: |
          node tests/boot-wiring.mjs
          node tests/keyboard.mjs
          node tests/mode-filter.mjs
          node tests/route-history.mjs
          node tests/golden-hour.mjs
          node tests/enroute.mjs
          node tests/summit.mjs
          node tests/storage-full.mjs
          node tests/board-refresh.mjs
          node tests/outage-not-verdict.mjs
          node tests/verbund.mjs
          node tests/vehicle.mjs
          node tests/last-home.mjs

      - name: Install Playwright (Chromium)
        run: |
          npm init -y >/dev/null
          npm install --no-save playwright@^1.47.0
          npx playwright install --with-deps chromium
      - name: Smoke test
        run: node tests/smoke.mjs

  deploy:
    needs: test              # <-- the gate: no deploy unless the test job is green
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Stamp the build into the page that goes live. There is no build step and
      # this must not create one: the repo file keeps saying "dev" and only the
      # artifact carries the SHA, so opening index.html locally still works.
      # The verify is the whole point -- a stamp that quietly stopped updating
      # would be worse than none, because it would be believed.
      - name: Stamp the build
        run: |
          set -euo pipefail
          SHA="$(git rev-parse --short HEAD)"
          STAMP="$SHA $(date -u +%Y-%m-%d\ %H:%MZ)"
          sed -i "s|^const BUILD = \"dev\";  // BUILD-STAMP\$|const BUILD = \"$STAMP\";  // BUILD-STAMP|" index.html
          grep -q "^const BUILD = \"$STAMP\";  // BUILD-STAMP\$" index.html \
            || { echo "::error::build stamp did not apply -- the BUILD-STAMP line in index.html moved or changed shape"; exit 1; }
          echo "stamped: $STAMP"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .            # static single-file site + manifest/icons (same content Pages serves today)
      - id: deployment
        uses: actions/deploy-pages@v4
