<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Rail">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<title>Rail &#183; live departures</title>
<style>
  :root{
    --bg:#0a0a0c; --bg2:#141418; --card:#17171c; --card2:#1e1e24;
    --line:#26262e; --txt:#f4f4f6; --dim:#9a9aa6; --faint:#5a5a66;
    --red:#eb0000; --redsoft:#ff3b3b; --grn:#22c55e; --amber:#f59e0b;
    --blue:#3b82f6; --violet:#8b5cf6; --teal:#14b8a6;
    --radius:18px; --shadow:0 8px 30px rgba(0,0,0,.45);
    --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    background:
      radial-gradient(1200px 600px at 50% -10%, #1b1220 0%, transparent 55%),
      radial-gradient(900px 500px at 100% 0%, #101822 0%, transparent 50%),
      var(--bg);
    color:var(--txt);
    font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
    -webkit-font-smoothing:antialiased; overscroll-behavior-y:contain;
    display:flex; flex-direction:column; min-height:100%;
  }
  .wrap{max-width:640px; width:100%; margin:0 auto; flex:1; display:flex; flex-direction:column;
    padding:calc(var(--safe-t) + 14px) 16px calc(var(--safe-b) + 96px)}

  /* ---- header ---- */
  header{display:flex; align-items:center; gap:12px; margin-bottom:14px}
  .brand{display:flex; align-items:center; gap:10px; font-weight:800; letter-spacing:-.02em; font-size:20px}
  .mark{width:34px; height:34px; border-radius:10px; display:grid; place-items:center;
    background:linear-gradient(145deg,var(--red),#a30000); box-shadow:0 4px 14px rgba(235,0,0,.4);
    font-size:19px; color:#fff}
  .brand small{display:block; font-weight:500; font-size:11px; color:var(--dim); letter-spacing:.06em; text-transform:uppercase}
  .clock{margin-left:auto; text-align:right; font-variant-numeric:tabular-nums}
  .clock b{font-size:22px; font-weight:700; letter-spacing:-.02em}
  .clock span{display:block; font-size:11px; color:var(--faint)}

  /* ---- tabs ---- */
  .tabs{display:flex; background:var(--bg2); border:1px solid var(--line); border-radius:14px; padding:4px; margin-bottom:14px}
  .tabs button{flex:1; border:0; background:transparent; color:var(--dim); font:600 14px/1 inherit;
    padding:11px; border-radius:10px; transition:.25s; cursor:pointer}
  .tabs button.on{background:linear-gradient(145deg,#2a2a33,#202027); color:#fff; box-shadow:0 2px 8px rgba(0,0,0,.4)}

  /* ---- search / inputs ---- */
  .field{position:relative; margin-bottom:10px}
  .field .ico{position:absolute; left:14px; top:50%; transform:translateY(-50%); color:var(--faint); font-size:16px; pointer-events:none}
  input.stn{width:100%; background:var(--card); border:1px solid var(--line); color:var(--txt);
    font:500 16px inherit; padding:15px 44px 15px 42px; border-radius:14px; outline:none; transition:.2s}
  input.stn:focus{border-color:#3a3a46; background:var(--card2)}
  .field .clr{position:absolute; right:10px; top:50%; transform:translateY(-50%); width:26px; height:26px;
    border:0; border-radius:50%; background:#2a2a33; color:var(--dim); font-size:14px; display:none; place-items:center; cursor:pointer}
  .field.has .clr{display:grid}

  .ac{position:absolute; z-index:40; left:0; right:0; top:calc(100% + 6px); background:var(--card2);
    border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); overflow:hidden; display:none}
  .ac.show{display:block; animation:pop .16s ease}
  .ac div{padding:13px 16px; border-bottom:1px solid var(--line); cursor:pointer; display:flex; align-items:center; gap:10px}
  .ac div:last-child{border-bottom:0}
  .ac div:active{background:#26262f}
  .ac div .t{color:var(--faint); font-size:14px}

  .swap{display:flex; justify-content:center; margin:-4px 0}
  .swap button{width:38px; height:38px; border-radius:50%; border:1px solid var(--line); background:var(--card);
    color:var(--dim); font-size:17px; cursor:pointer; transition:.25s; box-shadow:var(--shadow)}
  .swap button:active{transform:rotate(180deg) scale(.9); color:#fff}

  /* ---- favourites ---- */
  .favs{display:flex; gap:8px; overflow-x:auto; padding:2px 0 12px; scrollbar-width:none}
  .favs::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto; background:var(--card); border:1px solid var(--line); color:var(--txt);
    padding:9px 14px; border-radius:999px; font:600 13px inherit; cursor:pointer; white-space:nowrap; transition:.2s}
  .chip:active{transform:scale(.94)}
  .chip.star{color:var(--amber)}

  /* ---- board ---- */
  .boardhead{display:flex; align-items:baseline; gap:8px; margin:6px 2px 12px}
  .boardhead h2{margin:0; font-size:20px; font-weight:800; letter-spacing:-.02em}
  .boardhead .star{margin-left:auto; background:none; border:0; font-size:22px; color:var(--faint); cursor:pointer; transition:.2s}
  .boardhead .star.on{color:var(--amber); text-shadow:0 0 14px rgba(245,158,11,.5)}
  .boardhead .rf{background:none;border:0;color:var(--dim);font-size:18px;cursor:pointer;padding:4px}
  .boardhead .rf.spin{animation:spin .8s linear infinite}

  .dep{display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--line);
    padding:14px; border-radius:16px; margin-bottom:9px; animation:rise .3s ease backwards}
  .badge{flex:0 0 auto; min-width:50px; height:38px; padding:0 10px; border-radius:10px; display:grid; place-items:center;
    font-weight:800; font-size:14px; letter-spacing:.01em; color:#fff; text-align:center}
  .dep .mid{flex:1; min-width:0}
  .dep .to{font-weight:700; font-size:16px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .dep .via{font-size:12px; color:var(--faint); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .dep .rt{flex:0 0 auto; text-align:right; min-width:66px}
  .dep .min{font-weight:800; font-size:19px; font-variant-numeric:tabular-nums; letter-spacing:-.02em}
  .dep .min.now{color:var(--grn)}
  .dep .at{font-size:12px; color:var(--dim); font-variant-numeric:tabular-nums}
  .dep .at .late{color:var(--redsoft); font-weight:700}
  .plat{display:inline-block; margin-top:3px; font-size:11px; color:var(--dim); background:#22222a; padding:2px 7px; border-radius:6px}
  .plat.chg{color:var(--amber); background:rgba(245,158,11,.12)}

  /* ---- connections ---- */
  .conn{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:15px; margin-bottom:11px; animation:rise .3s ease backwards}
  .conn .top{display:flex; align-items:center; gap:10px; font-variant-numeric:tabular-nums}
  .conn .tt{font-size:22px; font-weight:800; letter-spacing:-.02em}
  .conn .arr{color:var(--faint); font-size:16px}
  .conn .dur{margin-left:auto; text-align:right}
  .conn .dur b{font-size:16px; font-weight:700}
  .conn .dur span{display:block; font-size:11px; color:var(--faint)}
  .legs{display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin-top:12px; padding-top:12px; border-top:1px solid var(--line)}
  .legs .b2{min-width:0; height:26px; padding:0 8px; border-radius:8px; display:grid; place-items:center; font-weight:800; font-size:12px; color:#fff}
  .legs .sep{color:var(--faint); font-size:13px}
  .conn .meta{margin-top:10px; font-size:12px; color:var(--dim)}
  .conn .meta b{color:var(--txt)}
  .conn .plt{color:var(--amber)}

  /* ---- smart change-finder ---- */
  .smartbar{display:flex; align-items:center; gap:10px; margin:2px 2px 14px; flex-wrap:wrap}
  .smart-toggle{display:flex; align-items:center; gap:9px; cursor:pointer; user-select:none}
  .smart-toggle input{position:absolute; opacity:0; pointer-events:none}
  .smart-toggle .track{width:42px; height:24px; border-radius:999px; background:#2a2a33; border:1px solid var(--line); position:relative; transition:.25s; flex:0 0 auto}
  .smart-toggle .knob{position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%; background:#6a6a76; transition:.25s}
  .smart-toggle input:checked + .track{background:linear-gradient(145deg,var(--red),#a30000); border-color:transparent}
  .smart-toggle input:checked + .track .knob{left:20px; background:#fff}
  .smart-toggle .lbl{font-weight:700; font-size:14px}
  .smart-hint{font-size:11px; color:var(--faint)}
  .shead{font-size:13px; color:var(--dim); background:var(--card); border:1px solid var(--line); border-radius:12px; padding:11px 13px; margin-bottom:12px; line-height:1.5}
  .shead.warn{background:rgba(245,158,11,.1); border-color:rgba(245,158,11,.3); color:#ffe0a3}
  .shead.good{border-color:rgba(34,197,94,.25)}
  .shead b{color:var(--txt)}
  .conn.win{border-color:rgba(34,197,94,.5); box-shadow:0 0 0 1px rgba(34,197,94,.15),var(--shadow)}
  .conn.hastight{border-color:rgba(245,158,11,.4)}
  .chg{display:flex; flex-wrap:wrap; gap:6px; margin-top:11px}
  .cx{font-size:11px; padding:3px 9px; border-radius:7px; background:#22222a; color:var(--dim); font-variant-numeric:tabular-nums}
  .cx b{color:var(--txt); font-weight:800}
  .cx.warn{background:rgba(245,158,11,.12); color:var(--amber)}
  .cx.warn b{color:var(--amber)}
  .cx.tight{background:rgba(235,0,0,.16); color:#ff8f8f}
  .cx.tight b{color:#ff8f8f}
  .rbrow{display:flex; align-items:center; gap:7px; flex-wrap:wrap; margin-bottom:6px}
  .rbrow:empty{display:none}
  .rib{font-size:10px; font-weight:800; letter-spacing:.03em; text-transform:uppercase; padding:3px 8px; border-radius:6px; white-space:nowrap}
  .rib.pick{background:rgba(34,197,94,.16); color:#7be6a3}
  .rib.base{background:#26262f; color:var(--dim)}
  .rib.tight{background:rgba(245,158,11,.16); color:var(--amber)}
  .viatag{font-size:11px; color:var(--violet); font-weight:700}

  /* ---- states ---- */
  .skel{height:66px; border-radius:16px; margin-bottom:9px;
    background:linear-gradient(100deg,var(--card) 30%,#22222a 50%,var(--card) 70%); background-size:200% 100%;
    animation:sh 1.2s linear infinite}
  .empty{text-align:center; color:var(--faint); padding:60px 20px}
  .empty .big{font-size:40px; margin-bottom:10px; opacity:.5}
  .err{background:rgba(235,0,0,.1); border:1px solid rgba(235,0,0,.3); color:#ffb3b3;
    padding:14px; border-radius:14px; text-align:center; font-size:14px}
  .hint{color:var(--faint); font-size:13px; text-align:center; padding:8px}

  @keyframes pop{from{opacity:0; transform:translateY(-6px)}to{opacity:1}}
  @keyframes rise{from{opacity:0; transform:translateY(8px)}to{opacity:1}}
  @keyframes sh{to{background-position:-200% 0}}
  @keyframes spin{to{transform:rotate(360deg)}}
  .view{display:none}
  .view.on{display:block}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="mark">&#9679;</div>
      <div>Rail<small>live swiss departures</small></div>
    </div>
    <div class="clock"><b id="clk">--:--</b><span id="clkd">&nbsp;</span></div>
  </header>

  <div class="tabs">
    <button id="tabDep" class="on" onclick="setTab('dep')">Departures</button>
    <button id="tabJrn" onclick="setTab('jrn')">Journey</button>
  </div>

  <!-- DEPARTURES -->
  <section id="vDep" class="view on">
    <div class="field" id="fDep">
      <span class="ico">&#9906;</span>
      <input class="stn" id="iDep" placeholder="Search a station&#8230;" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button class="clr" onclick="clearField('dep')">&#10005;</button>
      <div class="ac" id="acDep"></div>
    </div>
    <div class="favs" id="favs"></div>
    <div id="depOut"></div>
  </section>

  <!-- JOURNEY -->
  <section id="vJrn" class="view">
    <div class="field" id="fFrom">
      <span class="ico">&#9679;</span>
      <input class="stn" id="iFrom" placeholder="From&#8230;" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button class="clr" onclick="clearField('from')">&#10005;</button>
      <div class="ac" id="acFrom"></div>
    </div>
    <div class="swap"><button onclick="swap()" title="swap">&#8645;</button></div>
    <div class="field" id="fTo">
      <span class="ico">&#9873;</span>
      <input class="stn" id="iTo" placeholder="To&#8230;" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button class="clr" onclick="clearField('to')">&#10005;</button>
      <div class="ac" id="acTo"></div>
    </div>
    <div class="smartbar">
      <label class="smart-toggle">
        <input type="checkbox" id="smartTog" checked onchange="onSmartToggle()">
        <span class="track"><span class="knob"></span></span>
        <span class="lbl">Smart change-finder</span>
      </label>
      <span class="smart-hint">sweeps hubs &amp; flags tight changes</span>
    </div>
    <div id="jrnOut"><div class="hint">Enter two stations to plan a journey.</div></div>
  </section>
</div>

<script>
const API = "https://transport.opendata.ch/v1";
const $ = id => document.getElementById(id);
const LS = { favs:"rail.favs", last:"rail.last" };
let favs = load(LS.favs, []);
let current = "";        // current departures station
let refreshTimer = null;
let tickTimer = null;
let lastBoard = [];      // cached stationboard for live tick

/* ---------- utils ---------- */
function load(k,d){ try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d} }
function save(k,v){ localStorage.setItem(k, JSON.stringify(v)); }
function esc(s){ return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function hhmm(iso){ const d=new Date(iso); return d.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"}); }
function minsUntil(iso){ return Math.round((new Date(iso)-Date.now())/60000); }
function debounce(fn,ms){ let t; return (...a)=>{clearTimeout(t); t=setTimeout(()=>fn(...a),ms)}; }

/* category -> colour (SBB-ish) */
function catColor(cat){
  const c=(cat||"").toUpperCase();
  if(/^(IC|ICE|EC|TGV|RJ|EN)/.test(c)) return "var(--red)";
  if(/^(IR|RE|PE)/.test(c))            return "#c026d3";
  if(/^S/.test(c))                     return "var(--blue)";
  if(/^(R|RB)$/.test(c))               return "var(--teal)";
  if(/^(T|NF)/.test(c))                return "var(--amber)";
  if(/^(B|BUS|NB)/.test(c))            return "var(--grn)";
  return "var(--violet)";
}
function badge(cat,num){ const l=((cat||"")+(num?" "+num:"")).trim()||"&#183;"; return {label:l, col:catColor(cat)}; }

/* ---------- API ---------- */
async function api(path){
  const r = await fetch(API+path);
  if(!r.ok) throw new Error("HTTP "+r.status);
  return r.json();
}
const locCache = new Map();
async function locations(q){
  if(locCache.has(q)) return locCache.get(q);
  const d = await api("/locations?type=station&query="+encodeURIComponent(q));
  const s = (d.stations||[]).filter(x=>x.name);
  locCache.set(q,s); return s;
}

/* ---------- autocomplete ---------- */
function wireAC(inpId, acId, fieldId, onPick){
  const inp=$(inpId), ac=$(acId), field=$(fieldId);
  const run = debounce(async ()=>{
    const q=inp.value.trim();
    field.classList.toggle("has", q.length>0);
    if(q.length<2){ ac.classList.remove("show"); return; }
    try{
      const s=await locations(q);
      if(!s.length){ ac.classList.remove("show"); return; }
      ac.innerHTML = s.slice(0,7).map(x=>
        `<div data-n="${esc(x.name)}"><span>&#9906;</span><span>${esc(x.name)}</span></div>`).join("");
      ac.classList.add("show");
      [...ac.children].forEach(el=>el.onclick=()=>{
        inp.value=el.dataset.n; ac.classList.remove("show");
        field.classList.add("has"); onPick(el.dataset.n);
      });
    }catch(e){ ac.classList.remove("show"); }
  },180);
  inp.addEventListener("input", run);
  inp.addEventListener("focus", ()=>{ if(inp.value.trim().length>=2) run(); });
  document.addEventListener("click", e=>{ if(!field.contains(e.target)) ac.classList.remove("show"); });
}
function clearField(which){
  const map={dep:["iDep","fDep"],from:["iFrom","fFrom"],to:["iTo","fTo"]};
  const [i,f]=map[which]; $(i).value=""; $(f).classList.remove("has"); $(i).focus();
}

/* ---------- DEPARTURES ---------- */
async function showDepartures(name){
  if(!name) return;
  current=name; save(LS.last,name);
  $("iDep").value=name; $("fDep").classList.add("has");
  $("acDep").classList.remove("show");
  renderBoardHead(name);
  $("depOut").innerHTML = `<div id="bh"></div>` + skel(6);
  renderBoardHead(name);
  clearInterval(refreshTimer); clearInterval(tickTimer);
  await loadBoard(name);
  refreshTimer=setInterval(()=>loadBoard(name,true), 30000);
  tickTimer=setInterval(tickBoard, 1000);
}
async function loadBoard(name, quiet){
  const rf=$("rf"); if(rf) rf.classList.add("spin");
  try{
    const d=await api("/stationboard?limit=12&station="+encodeURIComponent(name));
    lastBoard = d.stationboard||[];
    const rows = lastBoard.map((j,i)=>depRow(j,i)).join("");
    $("depOut").innerHTML = boardHeadHTML(d.station?.name||name) +
      (rows || `<div class="empty"><div class="big">&#9788;</div>No departures right now.</div>`);
    wireBoardHead(d.station?.name||name);
  }catch(e){
    if(!quiet) $("depOut").innerHTML = boardHeadHTML(name) +
      `<div class="err">Couldn&#39;t reach the network.<br>Check your connection and tap &#8635;.</div>`;
    wireBoardHead(name);
  }finally{ const r=$("rf"); if(r) r.classList.remove("spin"); }
}
function depRow(j,i){
  const b=badge(j.category, j.number||j.line);
  const dep=j.stop?.departure;
  const prog=j.stop?.prognosis?.departure;
  const late = prog && dep && (new Date(prog)-new Date(dep))>=60000;
  const eff = prog || dep;
  const m=minsUntil(eff);
  const mlabel = m<=0 ? "now" : m<60 ? m+"&#8242;" : hhmm(eff);
  const pl = j.stop?.platform;
  const plChanged = j.stop?.prognosis?.platform && j.stop.prognosis.platform!==pl;
  const effPl = j.stop?.prognosis?.platform || pl;
  return `<div class="dep" style="animation-delay:${i*28}ms">
    <div class="badge" style="background:${b.col}">${b.label}</div>
    <div class="mid">
      <div class="to">${esc(j.to||"&#8212;")}</div>
      <div class="via">${effPl?`<span class="plat${plChanged?" chg":""}">Pl. ${esc(effPl)}${plChanged?" &#9888;":""}</span> `:""}${esc(j.category||"")} ${esc(j.operator||"")}</div>
    </div>
    <div class="rt">
      <div class="min ${m<=2?"now":""}" data-t="${eff}">${mlabel}</div>
      <div class="at">${hhmm(dep)}${late?` <span class="late">+${Math.round((new Date(prog)-new Date(dep))/60000)}</span>`:""}</div>
    </div>
  </div>`;
}
function tickBoard(){
  document.querySelectorAll(".dep .min[data-t]").forEach(el=>{
    const m=minsUntil(el.dataset.t);
    el.innerHTML = m<=0?"now":m<60?m+"&#8242;":hhmm(el.dataset.t);
    el.classList.toggle("now", m<=2);
  });
}
function boardHeadHTML(name){
  const on=favs.includes(name);
  return `<div class="boardhead">
    <h2>${esc(name)}</h2>
    <button class="rf" id="rf" title="refresh">&#8635;</button>
    <button class="star ${on?"on":""}" id="fav" title="favourite">${on?"&#9733;":"&#9734;"}</button>
  </div>`;
}
function renderBoardHead(){ /* placeholder kept for flow */ }
function wireBoardHead(name){
  const fav=$("fav"); if(fav) fav.onclick=()=>toggleFav(name);
  const rf=$("rf"); if(rf) rf.onclick=()=>loadBoard(name);
}
function toggleFav(name){
  const i=favs.indexOf(name);
  if(i<0) favs.unshift(name); else favs.splice(i,1);
  favs=favs.slice(0,12); save(LS.favs,favs);
  renderFavs(); const f=$("fav"); if(f){ const on=favs.includes(name); f.className="star "+(on?"on":""); f.innerHTML=on?"&#9733;":"&#9734;"; }
}
function renderFavs(){
  const el=$("favs");
  if(!favs.length){ el.innerHTML=`<span class="chip" style="color:var(--faint);border-style:dashed" onclick="$('iDep').focus()">&#9734; Star stations for one-tap access</span>`; return; }
  el.innerHTML = favs.map(n=>`<button class="chip star" onclick="showDepartures('${n.replace(/'/g,"\\'")}')">&#9733; ${esc(n)}</button>`).join("");
}
function skel(n){ return Array(n).fill('<div class="skel"></div>').join(""); }

/* ---------- JOURNEY ---------- */
let fromName="", toName="";
function swap(){
  [fromName,toName]=[toName,fromName];
  $("iFrom").value=fromName; $("iTo").value=toName;
  $("fFrom").classList.toggle("has",!!fromName); $("fTo").classList.toggle("has",!!toName);
  if(fromName&&toName) planJourney();
}
function parseDur(s){ // "00d00:56:00"
  const m=/(\d+)d(\d+):(\d+):/.exec(s||""); if(!m) return s||"";
  const d=+m[1], h=+m[2], mi=+m[3]; const tot=d*1440+h*60+mi;
  return tot>=60 ? `${Math.floor(tot/60)}h ${tot%60}m` : `${tot}m`;
}
/* the killer feature: SBB's default list often hides better routes that a
   manual "what if I change at X" search finds, and buries a scary-tight
   transfer in its #1 pick. Smart mode sweeps a set of interchange hubs via[],
   widens the direct scan, computes real per-change buffers, and surfaces the
   options SBB didn't lead with — flagging tight changes and roomier picks. */
let smart = true;
let smartBusy = false;          // guard: the ~12-call sweep must not overlap itself
const HUBS = ["Z\u00fcrich HB","Bern","Basel SBB","Luzern","Olten","Arth-Goldau","Lausanne","Biel/Bienne","Z\u00fcrich Flughafen","Winterthur"];
const TIGHT = 5;   // minutes: a change below this is a sprint
const COMFY = 8;   // minutes: at/above this a change is relaxed
const SAFER_LATER = 10;  // a roomier option up to this many min slower still counts as "safer"
const WINDOW_MIN = 25;   // drop absurd detours arriving >this many min past the fastest

function onSmartToggle(){
  smart = $("smartTog").checked;
  if(fromName&&toName) planJourney();
}
function planJourney(){ return smart ? smartPlan() : plainPlan(); }

async function plainPlan(){
  if(!fromName||!toName) return;
  $("jrnOut").innerHTML = skel(4);
  try{
    const d=await api(`/connections?limit=6&from=${encodeURIComponent(fromName)}&to=${encodeURIComponent(toName)}`);
    const cs=d.connections||[];
    if(!cs.length){ $("jrnOut").innerHTML=`<div class="empty"><div class="big">&#9940;</div>No connections found.</div>`; return; }
    cs.forEach(annotate);
    $("jrnOut").innerHTML = cs.map((c,i)=>connCard(c,i)).join("");
  }catch(e){
    $("jrnOut").innerHTML=`<div class="err">Couldn&#39;t plan that journey.<br>Check the station names and try again.</div>`;
  }
}

async function tryConns(qs){
  try{ const d=await api("/connections?"+qs); return d.connections||[]; }
  catch(e){ return []; }
}
function connSig(c){ return (c.from?.departure||"")+"|"+(c.to?.arrival||"")+"|"+(c.duration||""); }
function changeDetails(c){
  const rides=(c.sections||[]).filter(s=>s.journey);
  const out=[];
  for(let k=1;k<rides.length;k++){
    // real-time prognosis when present (a delayed train's change is tighter
    // than scheduled — the whole point of tight-vs-safe), else scheduled
    const prevArr=rides[k-1].arrival?.prognosis?.arrival || rides[k-1].arrival?.arrival;
    const nextDep=rides[k].departure?.prognosis?.departure || rides[k].departure?.departure;
    const stn=rides[k].departure?.station?.name || rides[k-1].arrival?.station?.name || "";
    if(!prevArr||!nextDep) continue;
    const b=Math.round((new Date(nextDep)-new Date(prevArr))/60000);
    if(b>=0 && b<600) out.push({stn, b});
  }
  return out;
}
function annotate(c){
  const arrIso = c.to?.prognosis?.arrival || c.to?.arrival;
  const depIso = c.from?.prognosis?.departure || c.from?.departure;
  c._arr = arrIso ? new Date(arrIso).getTime() : Infinity;
  c._dep = depIso ? new Date(depIso).getTime() : 0;
  c._chg = changeDetails(c);
  c._buf = c._chg.length ? Math.min(...c._chg.map(x=>x.b)) : null;
  c._tight = c._buf!=null && c._buf<TIGHT;
  return c;
}

async function smartPlan(){
  if(!fromName||!toName || smartBusy) return;   // no overlapping sweeps (F1)
  smartBusy=true;
  $("jrnOut").innerHTML = skel(4);
  try{
    const f=encodeURIComponent(fromName), t=encodeURIComponent(toName);
    const base = await tryConns(`from=${f}&to=${t}&limit=6`);
    const baseline = base[0] ? annotate(base[0]) : null;

    const jobs = [ tryConns(`from=${f}&to=${t}&limit=16`) ];
    HUBS.forEach(h=>{
      if(h===fromName||h===toName) return;
      jobs.push(tryConns(`from=${f}&to=${t}&via[]=${encodeURIComponent(h)}&limit=3`)
        .then(cs=>cs.map(c=>{c._via=h; return c;})));
    });
    const swept = (await Promise.all(jobs)).flat();

    const seen=new Set(), all=[];
    base.concat(swept).forEach(c=>{ const s=connSig(c); if(!seen.has(s)){ seen.add(s); all.push(annotate(c)); } });
    if(!all.length){ $("jrnOut").innerHTML=`<div class="empty"><div class="big">&#9940;</div>No connections found.<br>Check the station names.</div>`; return; }

    const now=Date.now();
    const baseArr = baseline ? baseline._arr : Infinity;
    const baseBuf = baseline ? baseline._buf : null;
    const baseSig = baseline ? connSig(baseline) : "";
    all.forEach(c=>{
      c._isBase = connSig(c)===baseSig;
      c._earlier = c._arr < baseArr;
      c._safer   = !c._isBase && !c._tight && baseline!=null &&
                   (baseline._tight || (baseBuf!=null && c._buf!=null && c._buf>=baseBuf+3)) &&
                   c._arr <= baseArr + SAFER_LATER*60000;   // roomier, within the slower-tolerance window (F4)
      c._beats = c._earlier || c._safer;
      // F3: a genuine "smart pick" (green) must NOT be tight; an earlier-but-tight
      // option is an honest tradeoff, never crowned as safe and never hides its warning
      c._safePick   = c._beats && !c._tight;
      c._fasterTight = c._beats && c._tight;
      c._why = c._safer && c._earlier ? "earlier & roomier"
             : c._safer ? "roomier change"
             : "arrives earlier";
    });

    let cand = all.filter(c=> c._dep > now-60000 || c._isBase);
    const fastest = Math.min(...cand.map(c=>c._arr));
    cand = cand.filter(c=> c._isBase || c._arr <= fastest + WINDOW_MIN*60000);   // drop absurd detours
    cand.sort((a,b)=> (b._safePick-a._safePick) || (b._beats-a._beats) || (a._arr-b._arr) || ((b._buf??-1)-(a._buf??-1)) || (a._chg.length-b._chg.length));
    const top = cand.slice(0,7);
    const nSafe = top.filter(c=>c._safePick).length;
    const swN = new Set(swept.map(connSig)).size;

    $("jrnOut").innerHTML = smartHead(baseline, nSafe, swN) + top.map((c,i)=>connCard(c,i)).join("");
  }catch(e){
    $("jrnOut").innerHTML=`<div class="err">Couldn&#39;t plan that journey.<br>Check the station names and try again.</div>`;
  }finally{ smartBusy=false; }
}

function smartHead(baseline, nSafe, swN){
  if(!baseline) return `<div class="shead">Swept ${swN} hub route${swN===1?"":"s"} &#183; best options below &#8595;</div>`;
  const bb=baseline._buf;
  if(baseline._tight){
    return `<div class="shead warn">&#9888; SBB&#39;s fastest pick has a tight <b>${bb}&#8201;min</b> change at <b>${esc(baseline._chg.find(x=>x.b===bb)?.stn||"a hub")}</b>.`
      + (nSafe?` Found <b>${nSafe}</b> option${nSafe===1?"":"s"} with a safer change &#8595;`:` No safer alternative beat it &#8212; it&#39;s the fastest.`)
      + `</div>`;
  }
  if(nSafe) return `<div class="shead good">Swept ${swN} routes &#183; <b>${nSafe}</b> option${nSafe===1?"":"s"} the default list didn&#39;t lead with &#8595;</div>`;
  return `<div class="shead good">SBB&#39;s default looks solid${bb!=null?` (<b>${bb}&#8201;min</b> transfer slack)`:` (direct)`}. Full swept spread below &#8595;</div>`;
}

function connCard(c,i){
  const dep=c.from?.departure, arr=c.to?.arrival;
  const secs=(c.sections||[]).filter(s=>s.journey);
  const tr=c._chg ? c._chg.length : (c.transfers||0);
  const legs = secs.map(s=>{
    const b=badge(s.journey.category, s.journey.number);
    return `<span class="b2" style="background:${b.col}">${b.label}</span>`;
  }).join('<span class="sep">&#8250;</span>') || '<span class="sep">walk</span>';
  const chg = c._chg || [];
  const chgHTML = chg.length ? `<div class="chg">`+chg.map(x=>{
    const cls = x.b<TIGHT?"tight":x.b<COMFY?"warn":"";
    return `<span class="cx ${cls}">${esc(x.stn)} <b>${x.b}&#8242;</b></span>`;
  }).join("")+`</div>` : "";
  let ribs="";
  if(c._safePick) ribs+=`<span class="rib pick">&#9889; smart pick${c._why?" &#183; "+c._why:""}</span>`;
  else if(c._fasterTight) ribs+=`<span class="rib tight">&#9889; faster &#183; tight ${c._buf}&#8242; change</span>`;
  else if(c._isBase) ribs+=`<span class="rib base">SBB default</span>`;
  if(c._tight && !c._fasterTight) ribs+=`<span class="rib tight">&#9888; tight change</span>`;
  if(c._via) ribs+=`<span class="viatag">via ${esc(c._via)}</span>`;
  const dm=minsUntil(dep);
  return `<div class="conn ${c._safePick?"win":""} ${c._tight?"hastight":""}" style="animation-delay:${i*30}ms">
    <div class="top">
      <div class="tt">${hhmm(dep)}</div><span class="arr">&#8594;</span><div class="tt">${hhmm(arr)}</div>
      <div class="dur"><b>${parseDur(c.duration)}</b><span>${tr} change${tr===1?"":"s"}</span></div>
    </div>
    <div class="legs">${legs}</div>
    ${chgHTML}
    <div class="meta"><div class="rbrow">${ribs}</div>${dm>0&&dm<90?`Departs in <b>${dm} min</b>`:"Departs "+hhmm(dep)}</div>
  </div>`;
}

/* ---------- tabs / clock / boot ---------- */
function setTab(t){
  const dep=t==="dep";
  $("tabDep").classList.toggle("on",dep); $("tabJrn").classList.toggle("on",!dep);
  $("vDep").classList.toggle("on",dep); $("vJrn").classList.toggle("on",!dep);
}
function tickClock(){
  const d=new Date();
  $("clk").textContent=d.toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
  $("clkd").textContent=d.toLocaleDateString([], {weekday:"short",day:"numeric",month:"short"});
}

wireAC("iDep","acDep","fDep", showDepartures);
wireAC("iFrom","acFrom","fFrom", n=>{ fromName=n; if(toName) planJourney(); });
wireAC("iTo","acTo","fTo",     n=>{ toName=n;   if(fromName) planJourney(); });
$("iDep").addEventListener("keydown",e=>{ if(e.key==="Enter"){e.target.blur(); showDepartures(e.target.value.trim());}});

renderFavs();
tickClock(); setInterval(tickClock,1000);
const last=load(LS.last,"");
if(last) showDepartures(last);
else $("depOut").innerHTML=`<div class="empty"><div class="big">&#128647;</div>Search a station to see live departures.</div>`;

document.addEventListener("visibilitychange",()=>{ if(!document.hidden && current) loadBoard(current,true); });
</script>
